name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/azure-monitoring/**"
      - ".github/workflows/terraform-validation.yml"
  push:
    branches: [master]
    paths:
      - "infra/azure-monitoring/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Check formatting
        run: terraform -chdir=infra/azure-monitoring fmt -check -recursive

      - name: Initialize without backend
        run: terraform -chdir=infra/azure-monitoring init -backend=false

      - name: Validate configuration
        run: terraform -chdir=infra/azure-monitoring validate
