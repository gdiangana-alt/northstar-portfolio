name: Public site availability

on:
  pull_request:
    paths:
      - ".github/workflows/public-site-availability.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify public HTTPS response and expected content
        run: ./scripts/check-public-site.sh
